<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Dear Unknown</title>
    <link rel="shortcut icon" href="imagenes/imagen facon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="login-styles.css">
</head>

<body class="login-body">

    <div class="login-contenedor">
        <a href="index.html" class="login-logo">
            <svg class="logo-icono" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Dear Unknown">
                <ellipse cx="50" cy="82" rx="35" ry="6" fill="#000000" opacity="0.12"/>
                <path d="M15 72C28 67 42 70 50 75C58 70 72 67 85 72V40C72 35 58 38 50 43C42 38 28 35 15 40V72Z" fill="#FFFFFF" stroke="#2B78AC" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M50 43V75" stroke="#2B78AC" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M28 30C32 26 36 27 39 30C37 25 31 23 28 30Z" fill="#3B92CE"/>
                <path d="M44 22C50 16 56 18 60 22C57 15 48 12 44 22Z" fill="#0086D8"/>
                <path d="M65 28C69 24 73 25 76 28C74 23 68 21 65 28Z" fill="#16ACBD"/>
                <path d="M52 12C56 8 60 9 63 12C60 7 54 5 52 12Z" fill="#16ACBD"/>
            </svg>
            <h1>dear unknown</h1>
        </a>

        <h2>Iniciar Sesión</h2>
        <p class="subtitulo">Bienvenido de nuevo a tu espacio seguro</p>

        <form class="login-form" action="dashboard.html" method="GET">
            <div class="grupo-input">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login-submit">Ingresar</button>
        </form>

        <div class="login-footer">
            <p>¿Aún no tienes cuenta? <a href="register.html">Regístrate</a></p>
            <a href="index.html" class="volver">← Volver al inicio</a>
        </div>
    </div>

</body>

</html>
